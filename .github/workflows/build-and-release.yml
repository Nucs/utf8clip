name: Build and Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions: write-all

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Run tests
      run: dotnet test --configuration Release --verbosity minimal --nologo

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            platform: win-x64
            binary: utf8clip.exe
          - os: macos-latest
            runtime: osx-arm64
            platform: osx-arm64
            binary: utf8clip

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Get version info
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="0.0.0"
        fi
        COMMIT_SHA="${GITHUB_SHA:0:7}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
        echo "Building version $VERSION+$COMMIT_SHA"

    - name: Publish AOT
      run: |
        dotnet publish src/utf8clip.csproj \
          --configuration Release \
          --runtime ${{ matrix.runtime }} \
          -p:PublishAot=true \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ steps.version.outputs.COMMIT_SHA }} \
          --output publish
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}
        path: publish/${{ matrix.binary }}
        retention-days: 5

  build-dll:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Get version info
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="0.0.0"
        fi
        COMMIT_SHA="${GITHUB_SHA:0:7}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT

    - name: Build DLL
      run: |
        dotnet build src/utf8clip.csproj \
          --configuration Release \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:SourceRevisionId=${{ steps.version.outputs.COMMIT_SHA }}

    - name: Create package
      run: |
        mkdir -p package
        cp src/bin/Release/net10.0/utf8clip.dll package/
        cp src/bin/Release/net10.0/utf8clip.runtimeconfig.json package/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dotnet
        path: package/
        retention-days: 5

  create-release:
    needs: [build, build-dll]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release zips
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        mkdir -p release

        # Windows x64
        cd artifacts/win-x64
        zip ../../release/utf8clip-${VERSION}-win-x64.zip utf8clip.exe
        cd ../..

        # macOS ARM64
        cd artifacts/osx-arm64
        chmod +x utf8clip
        zip ../../release/utf8clip-${VERSION}-osx-arm64.zip utf8clip
        cd ../..

        # .NET DLL package
        cd artifacts/dotnet
        zip ../../release/utf8clip-${VERSION}-dotnet.zip *
        cd ../..

        ls -la release/

    - name: Generate checksums
      run: |
        cd release
        for f in *.zip; do
          sha256sum "$f" | cut -d' ' -f1 > "${f}.sha256"
          echo "${f}.sha256: $(cat ${f}.sha256)"
        done

    - name: Check if prerelease
      id: prerelease
      run: |
        if [[ "${{ steps.version.outputs.VERSION }}" == *"-"* ]]; then
          echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
        else
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*
        draft: false
        prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        generate_release_notes: true
        body: |
          ## utf8clip v${{ steps.version.outputs.VERSION }}

          UTF-8 clipboard tool with emoji support for Windows and macOS.

          ### Downloads

          | Platform | File |
          |----------|------|
          | Cross-platform | `utf8clip-${{ steps.version.outputs.VERSION }}-dotnet.zip` (requires .NET 10) |
          | Windows x64 | `utf8clip-${{ steps.version.outputs.VERSION }}-win-x64.zip` |
          | macOS ARM64 | `utf8clip-${{ steps.version.outputs.VERSION }}-osx-arm64.zip` |

          ### Usage
          ```bash
          # Extract and use
          unzip utf8clip-${{ steps.version.outputs.VERSION }}-<platform>.zip

          # Copy to clipboard
          echo "Hello 💪" | ./utf8clip

          # Paste from clipboard
          ./utf8clip

          # Cross-platform (requires .NET 10)
          dotnet utf8clip.dll
          ```

          ### Platform Requirements
          - **Cross-platform (.NET)**: Requires .NET 10 runtime
          - **Windows**: Native, no dependencies
          - **macOS**: Uses built-in `pbcopy`/`pbpaste`
